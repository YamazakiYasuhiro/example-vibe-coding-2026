          body: |4
            # PR作成ワークフロー (Create Pull Request Workflow)

            このワークフローは、実装したコードのコミットから、リモートリポジトリへのプッシュ、およびGitHub CLI (`gh` コマンド) を用いたPull Request (PR) の作成手順を定めます。また、PRマージ後に追加の改修が発生した際の運用ルールも定義します。

            ## 1. 変更の確認とコミット (漏れ確認と小口化)

            コードのコミットは本来、実装の各ステップ（関数の追加ごと、テストの追加ごとなど）で細かく実施されていることが理想です。ここでのコミット作業は、**コミット漏れがないかの最終確認**と、残っている変更を整理してコミットするためのフォローアップとして位置付けられます。

            1. **未コミットの変更を確認**:
               ```bash
               git status
               git diff
               ```
               まだコミットされていない変更がないか確認します。

            2. **コミットの小口化 (Small Commits)**:
               未コミットのファイルが複数ある場合や、変更内容が多岐にわたる場合は、`git add .` で一度にすべてをコミットするのではなく、**意味のある論理的な小さな単位（機能追加、バグ修正、リファクタリングなど）に分割して** `git add <対象ファイル>` と `git commit` を繰り返すことを強く検討してください。

            3. **コミットの実行**:
               コミットメッセージはプロジェクトの規則（英語）に従って記述します。
               **注意**: シェルからコマンドを実行する際、コミットメッセージ内のクォーテーション(`"`や`'`)、バッククォート(``` ` ```)、バックスラッシュ(`\`)、ドル記号(`$`) などのエスケープ処理に細心の注意を払ってください。途中で文字列が途切れないように適切にエスケープするか、複雑なメッセージの場合は一時ファイル(`tmp/commit_msg.txt`)に書き出してから `git commit -F tmp/commit_msg.txt` を使用することを推奨します。
               ```bash
               git commit -m "feat: add user authentication flow"
               ```

            4. **コミットメッセージの確認**:
               コミット実行後、必ずログを確認してメッセージが文字化けや意図しない途切れ方をしていないか確認します。
               ```bash
               git log -1
               ```
               もし問題があれば `git commit --amend` で修正します。

            5. **プッシュの実行**:
               現在のブランチをリモートにプッシュします。初回プッシュの場合は上流ブランチを設定します。
               ```bash
               git push -u origin <ブランチ名>
               ```

            ## 2. Pull Request の作成

            プッシュが成功したら、GitHub CLI (`gh`) を使用してPRを作成します。

            1. **環境変数のリセット**:
               `gh` コマンドが内部の認証システムと干渉しないよう、コマンド実行時に `GITHUB_TOKEN` を一時的に無効化して実行します。
            2. **PR作成コマンドの実行**:
               タイトル(`--title`)と本文(`--body`)は**英語**で記述してください。本文には変更の概要、関連するイシュー、確認事項などを含めます。
               ```bash
               # bashを使用し、インラインで環境変数をクリアして実行する例
               GITHUB_TOKEN= gh pr create --title "Feature: User Authentication" --body "## Description
               Added the user authentication flow based on the specification.

               ## Changes
               - Implemented login component
               - Added token validation
               - Updated E2E tests"
               ```

            3. **作成結果の確認**:
               コマンドが出力するPRのURLを確認し、作成が成功したことをユーザーに報告します。

            ## 3. 追加改修の運用フロー (PRマージ前/後)

            状況に応じて、以下の運用ルールに従って改修をコミット・PRします。

            ### A. 対象のPRがまだオープン（マージ前）の場合
            追加の改修やレビュー指摘の修正が必要になった場合は、**現在のブランチのまま**作業を続けます。
            1. コードを修正
            2. `git add` & `git commit`
            3. `git push`
            ※ すでにPRが作成されているため、`git push` するだけで自動的にオープン中のPRに追加・反映されます。新たにPRを作成する必要はありません。

            ### B. 対象のPRがマージ済みの後に更なる改修が必要になった場合
            マージ済みのブランチで作業を続けると、既存の変更を含んだ不要な差分が混じるため、**必ず新しいブランチを作成**して差分だけをPRします。
            1. 最新の `main` (または `master`) を取得:
               ```bash
               git checkout main
               git pull origin main
               ```
            2. 新しい作業ブランチを作成（例: `fix-auth-edge-cases`）:
               ```bash
               git checkout -b <新しいブランチ名>
               ```
            3. コードを修正（追加改修の差分のみ実装）
            4. 本ワークフローの「1. コミットとプッシュ」と「2. Pull Request の作成」を再実施し、新しいPRを作成します。
          description: Create a pull request from committed code changes and manage post-merge revisions.
          id: create-pull-request
          kind: procedure
          selected: true
          tags:
            - baseline
          title: Create Pull Request
          trigger:
            command: create-pull-request
        - apiVersion: agent.meta/v1
          body: "\n# 仕様書作成ワークフロー\n\nこのワークフローは、ユーザーが述べた内容を元に、構造化された仕様書 (`.../ideas/.../XXX-{Name}.md`) を作成します。\n\n## 1. 準備: ステータスとコンテキストの確認\n\n1.  **ステータスの取得**:\n    *   `scripts/utils/show_current_status.sh` を実行します。\n    *   JSON出力から `phase`, `branch`, `next_idea_id` を取得します。\n    *   以下、`[Phase]`, `[Branch]`, `[NextID]` とします。\n\n## 2. 出力先の決定\n\n1.  **ディレクトリの確定**:\n    *   基本パス: `prompts/phases/[Phase]/branches/[Branch]/ideas/`\n    *   例: `prompts/phases/001-webservices/branches/main/ideas/`\n    *   このディレクトリが存在しない場合は作成します。\n2.  **ファイル名の決定**:\n    *   形式: `[NextID]-[名前].md`\n    *   `[名前]` 部分は、仕様の内容を適切に表現する簡潔な名称を使用します（例: `Tokenizer`, `RateLimit-GlobalManagement`など）。\n\n## 3. 仕様書の内容構成\n\n仕様書には、以下の項目を最低限含める必要があります:\n\n1.  **背景 (Background)**:\n    *   なぜこの機能や変更が必要なのか。\n    *   現在の課題や問題点。\n    *   わかる範囲で記載します（不明な場合は省略可）。\n2.  **要件 (Requirements)**:\n    *   実現すべき機能や満たすべき条件。\n    *   具体的な振る舞いや制約事項。\n    *   必須要件と任意要件を明確に区別します。\n3.  **実現方針 (Implementation Approach)**:\n    *   どのような技術やアーキテクチャで実現するか。\n    *   主要なコンポーネントやモジュールの概要。\n    *   設計上の重要な決定事項。\n4.  **検証シナリオ (Verification Scenarios)**:\n    *   **重要 (Preserve Details)**: ユーザーが具体的な手順、条件、またはテストシナリオ（例: 「(1)○○して(2)××する」）を提示した場合は、**要約したり「要件」に丸め込んだりせず、ここにそのままの粒度で転記・整理してください。**\n    *   ここは「何をもって完了とするか」の具体的なイメージを共有する場所です。\n    *   形式: 番号付きリストでの時系列記述を推奨します。\n5.  **テスト項目 (Testing for the Requirements)**:\n    *   要件が実現されたと確認するための、**自動化された検証手順**を記載します。\n    *   **重要 (Mandatory Automated Verification)**:\n        *   手動確認（「画面を目視で確認」など）だけの計画は許可されません。\n        *   必ずプロジェクト標準のスクリプトを使用した検証コマンドを明記してください。\n    *   どの要件を、どのスクリプト/テストケースで検証するかを対比して記述します。\n    *   **ビルド・全体検証の書き方**:\n        *   **ビルド**: `scripts/process/build.sh` を記載します（全体ビルド＋単体テスト）。\n        *   **統合テスト**: `scripts/process/integration_test.sh` を記載しますが、**オプションなしでの実行を推奨しません**。以下のガイドラインに従ってください。\n    *   **`integration_test.sh` の実行戦略**:\n        *   オプションなしで実行すると全カテゴリの統合テストが長時間実行され、不安定なテストも含まれるため、開発中の検証には不向きです。全カテゴリ一括実行は Nightly build 等の用途に留めてください。\n        *   仕様書では、**影響範囲を分析した上で、`--categories` や `--specify` オプションを使った具体的な実行コマンドを複数記述する**こと。\n        *   利用可能なカテゴリ: `common`, `llm`, `taskengine`, `template`, `gui`\n        *   `--specify \"REGEX\"` で特定テストに絞り込むことも可能です。\n        *   記述例:\n            ```\n            ### ビルド・全体検証\n            \n            1. ビルド＋単体テスト:\n               scripts/process/build.sh\n            \n            2. バックエンド統合テスト（共通機能のリグレッション確認）:\n               scripts/process/integration_test.sh --categories \"common\"\n            \n            3. GUI 統合テスト（UI 変更の確認）:\n               scripts/process/integration_test.sh --categories \"gui\" --specify \"SettingsGear|MailPost\"\n            ```\n        *   仕様の影響範囲に応じて、実行するカテゴリと `--specify` の対象を適切に選定します。影響しないカテゴリは含めないでください。\n\n## 4. 仕様書の作成と保存\n\n1.  **ユーザーとの対話**:\n    *   ユーザーが述べた内容を注意深く聞き、必要に応じて質問して詳細を明確にします。\n    *   背景、要件、実現方針、**および具体的な検証シナリオ**の4つの観点で情報を整理します。\n    *   **警告**: ユーザーが具体的な手順（Scenario）を提示している場合、それを勝手に抽象的な「機能要件」だけに変換して手順を捨ててはいけません。必ず「検証シナリオ」として詳細を残してください。\n2.  **マークダウン形式での作成**:\n    *   見出し、リスト、テーブルなどを適切に使用して読みやすく構造化します。\n    *   コードサンプルやAPIの例があれば、コードブロックで記載します。\n    *   Mermaid図などを用いて、アーキテクチャや処理フローを視覚化することも推奨されます。\n3.  **ファイルの保存**:\n    *   決定したファイル名で、指定されたディレクトリにファイルを保存します。\n\n## 5. 完了確認\n\n1.  **内容のレビュー**:\n    *   作成した仕様書が、背景・要件・実現方針の観点をカバーしているか確認します。\n2.  **ドキュメントの Git コミット**:\n    *   作成・更新した仕様書ファイルを `git add` → `git commit` してください。\n    *   コミットメッセージ例: `docs: add specification XXX-Name`\n    *   修正が複数回あった場合は、最終版をまとめてコミットしても構いません。\n    ```bash\n    git add prompts/phases/[Phase]/branches/[Branch]/ideas/[ファイル名]\n    git commit -m 'docs: add specification XXX-Name'\n    ```\n3.  **ファイルパスの提示**:\n    *   作成したファイルへのリンクをユーザーに提示します。\n        * 「file://プロジェクトルートからの相対パス」を用いること\n    *   **フェーズ移行**: 次のステップ（実装計画の作成等）に進むのは、ユーザーが明示的に指示した場合のみです。勝手に `create-implementation-plan` に進まないでください。\n"
          description: Create a structured specification document capturing background, requirements, and verification scenarios.
          id: create-specification
          kind: procedure
          selected: true
          tags:
            - baseline
          title: Create Specification
          trigger:
            command: create-specification
        - apiVersion: agent.meta/v1
          body: |4-
            # 実装実行ワークフロー

            実装計画書 (`.../plans/.../XXX.md`) に基づき、コーディングルールとテストルールを遵守して実装を行う。

            ## 1. 入力とルールの確認

            1.  **入力ファイルの特定**:
                *   ユーザーが指定したファイル、または現在エディタで開いているファイルを「実装計画書」として扱う。
            2.  **ルールの読み込み**:
                *   `{{policy:coding-rules}}` (コーディングルール)
                *   `{{policy:testing-rules}}` (テスト実施ルール)
                *   `{{policy:logging-rules}}` (ログ記述ルール)

            ## 2. 実装の実行

            1.  **計画の読み込み**:
                *   実装計画書の内容を読み、変更対象のファイルや具体的な変更内容を把握する。
                *   計画が複数ファイルに分割されている場合は、すべての計画ファイルを確認する。
            2.  **進捗の追跡**:
                *   `[ ]` → `[/]` (進行中) → `[x]` (完了) でチェックボックスを更新する。
            3.  **コーディング**:
                *   計画書の手順に従ってコードを記述・修正する。
                *   `{{policy:coding-rules}}` のスタイルや設計原則を厳守する。
                *   `{{policy:logging-rules}}` のレベル基準に従い、DEBUG ログを積極的に挿入する。
            4.  **こまめな Git コミット**:
                *   各ステップ完了ごとに `git add` → `git commit` を実施する。
                *   コミットルールの詳細は `instructions.md` の「Git 操作ルール」を参照。

            ## 2.5 E2Eテストの実装

            実装計画の Verification Plan に **E2E Tests** セクションがある場合、テスト実行の**前に**、E2Eテストコードを実装する。

            > [!CAUTION]
            > **「手動でコマンドを実行して動作確認する」ことは、E2Eテストコードの代替にはならない。**
            > 手動確認で得られた知見は、必ずテストコードとして残し、リグレッションテストとして機能するようにすること。

            1.  **既存インフラの確認**:
                *   `tests/` 配下の既存E2Eテストファイルを確認し、ヘルパー関数を把握する。
            2.  **E2Eテストコードの実装**:
                *   実装計画の Verification Plan に記載されたE2Eテストケースをコードとして実装する。
            3.  **コミット**:
                *   `git add && git commit` でE2Eテストコードをコミットする。

            ## 3. テストと検証

            テスト実施の詳細ルール（実行順序、修正ループ、タイムアウト方針等）は `{{policy:testing-rules}}` を参照。

            ### 3.1 テスト実施の順序

            1.  **Build & Unit Test (必須)**:
                *   `./scripts/process/build.sh` を実行する。
                *   **失敗時は次のステップに進んではならない。**
            2.  **統合テストの実施**:
                *   Build 成功後のみ実行する。
                *   `./scripts/process/integration_test.sh --categories "xxx"` で関連カテゴリを指定実行する。
                *   **失敗時は testing-rules.md Section 3 の修正ループに従い修正する。**

            ### 3.2 修正と再テスト

            > [!CAUTION]
            > **NEVER IGNORE FAILURES**: ビルドやテストの失敗を無視してタスクを完了させることは禁止。

            修正ループの詳細手順は `{{policy:testing-rules}}` Section 3 を参照。
            「後で直す」は禁止。その場で修正し、コミットする。


            ### 3.3 遠方知識の記録 (Far-Knowledge Recording)

            > [!CAUTION]
            > **省略禁止**: git push の前に、このステップを**必ず**実行してください。
            > 遠方知識に該当する変更がない場合でも、判定プロセスは実行し、
            > 「no update」の報告を出してから次に進んでください。

            全てのビルドとテストが成功し、コミットが完了した後、git push の**前に**、
            **record-far-knowledge** スキルに従って遠方知識の記録を行ってください。

            体系化・スキル化は別途 **systematize-far-knowledge** ワークフローで実施します。

            ## 4. Git Push

            全てのビルドとテストが成功した後、`git push` を実施する。
            テストが失敗している状態ではプッシュしない。
