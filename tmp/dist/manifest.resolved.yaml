          body: "# \U0001F916 Vibe Coding 標準 (2026年6月4日版)\n\n## 1 理念と目的\n\n### 1.1 Vibe Codingとは\n\nVibe Codingとは、**生成AI (LLM)** を単なるコードジェネレーターとしてではなく、アイデアの壁打ち相手、知識の整理係、そして実装パートナーとして活用し、人間とAIが協調しながら開発を進める手法です。\n\nこの標準は、**プロンプトを体系的にファイル化し管理する**ことで、AIが持つコンテキストの限界を超え、開発のどの段階においても一貫性、品質、効率を最大化することを目的とします。\n\n### 1.2 役割分担\n\n| **役割** | **人間（開発者）の責任** | **AI（LLM）の責任** |\n| ----- | ----- | ----- |\n| **戦略と判断** | プロジェクトのビジョン、技術選定、アーキテクチャの最終判断、法的・倫理的チェック。 | 計画と設計の提案、技術的選択肢の提示。 |\n| **コンテキスト管理** | ルール、アイデア、計画を**ファイルとして作成・更新・参照**する（プロンプトマネジメント）。 | 参照されたファイルに基づき、**常に最新かつ一貫したコンテキスト**を維持し、タスクを実行する。 |\n| **品質保証** | AIが生成したコードの最終レビュー、重要なセキュリティ/性能検証。 | 要求に基づくコード生成、対応する単体テストコードの作成、ルールの遵守。 |\n\n-----\n\n## 2 フォルダ構成の全体像\n\nプロンプトは、フェーズに依存しない共通知識と、フェーズごとの変動履歴の2つに大別し、以下の階層構造で管理します。\n\n```\n├── prompts/\n│   ├── specifications/                  # [フェーズ非依存] プロジェクト全体の最新仕様書\n│   ├── manifest/                        # [フェーズ非依存] ポリシー・プロシージャ・スキルの IR 定義\n│   │   ├── code_content/policies/         # コーディング規約、テストルール等\n│   │   ├── code_content/procedures/       # ワークフロー定義\n│   │   └── targets/                       # ターゲット固有のパス設定\n│   ├── memory/                          # [フェーズ非依存] アーキテクチャメモリ\n│   ├── refs/                            # [フェーズ非依存] プロジェクト全体で共通の参考資料\n│   │   └── global-apis.md               # 例: API定義\n│   └── phases/                          # [フェーズ依存] 開発フェーズごとの履歴とプロンプト\n│       └── {nnn}-{phase_name}/          # 例: 001-prototype (アクティブな開発フェーズ)\n│           ├── branches/                # ブランチ別のアイデアと計画\n│           │   └── {branch_id}/         # 例: main\n│           │       ├── ideas/           # アイデア、要件定義 (What)\n│           │       │   └── 000-FirstIdea.md\n│           │       └── plans/           # 開発計画、タスク定義 (How - Plan)\n│           │           └── 000-FirstPlan.md\n│           ├── designs/                 # 設計ドキュメント、構造定義 (Structure) 【任意】\n│           └── refs/                    # フェーズ固有の参考資料 【任意】\n```\n\n-----\n\n## 3 グローバル知識の管理（フェーズ非依存の知識）\n\nこれらのフォルダは、特定の開発フェーズに紐づかず、**プロジェクト全体を通じて役割とパスが固定されます**。内容（ファイルの中身）は必要に応じて随時アップデートされます。\n\n### 3.1 ポリシー管理（manifest の policies）\n\n**目的:** Vibe Codingのプロセス自体を規定する**メタ・ルール**と、コード生成の品質を規定する**実務ルール**の両方を管理し、AIの出力の一貫性、品質、セキュリティを保証します。ルールは manifest の `policies/` 配下で IR ファイルとして管理され、コンパイラによりターゲット固有のパスに展開されます。\n\n| **ルールの種類** | **IRファイル例** | **記述すべき項目** |\n| ----- | ----- | ----- |\n| **メタ・ルール** | **`vibe-coding-standard.md`** | **このドキュメント自体**。開発プロセス、ファイル命名規則、役割分担など。 |\n| **共通ルール (Always)** | **`coding-rules.md`** | **ビルドとテスト方針**（TDDの強制、カバレッジ目標）、**コーディング規約**（命名規則、ファイル構成）、**エラーハンドリング**など。**常にAIに適用させるべき最低限の実務ルール。** |\n| **シーン別ルール (Scenario)** | **`planning-rules.md`** / **`testing-rules.md`** | **特定のタスク**（例: 計画策定、テスト実装）にのみ適用する詳細な実務規約。 |\n\n**運用:**\n\n1.  **共通ルールの設定:** `activation.mode: always` のポリシーはコンパイル時に自動的に `.agent/rules/instructions.md` に統合され、常にAIに適用されます。\n2.  **シーン別ルールの適用:** `activation.mode: manual` のポリシーは個別のファイルとして展開され、ワークフロー内のテンプレート参照 (`{{policy:testing-rules}}` 等) で必要時に読み込まれます。\n3.  **注意:** AIの出力がルールを無視した場合、該当するルールファイルを改めて参照させ、再検討を依頼します。\n\n### 3.2 `prompts/refs/` の利用（共通参照資料の永続的なパス）\n\n**目的:** 複数のフェーズをまたいで参照される、プロジェクト固有の共通知識を保存します。\n\n| **内容例** | **記述すべき項目** |\n| **`global-apis.md`** | プロジェクトが利用する外部APIの仕様概要、認証フローなど。 |\n| **`common-utilities.ts`** | 全体で共通して利用されるヘルパー関数やカスタムユーティリティコード。 |\n\n**運用:**\n\n- AIへの依頼時、このフォルダ内のファイルを**明示的に参照**させることで、AIはプロジェクト全体にわたる知識に基づいてタスクを実行できます。\n\n-----\n\n## 4 開発フェーズの管理（フェーズ依存の知識）\n\n### 4.1 フェーズフォルダの命名と切り替え\n\n**命名規則:** `{nnn}-{phase_name}` (例: `001-prototype`)\n\n- **切り替え:** 現行フェーズの開発が完了したら、`phases/`直下に**連番を上げた新しいフェーズフォルダ**を作成します。\n- **履歴の保持:** 古いフェーズフォルダは移動させず、そのまま残します。これにより、以前の議論や決定事項が履歴として完全に保持され、パスも不変となります。\n\n### 4.2 フェーズ内のサブフォルダとプロセス (概要)\n\n| **フォルダ** | **役割** | **サマリー（目的と主なアクション）** |\n| ----- | ----- | ----- |\n| **ideas/** | **要件定義 (What)** | AIとの壁打ち結果をMarkdown化し、要件、ビジョン、機能を定義する最上位のコンテキスト。 |\n| **plans/** | **開発計画 (How)** | `ideas/`を参照させ、具体的なタスク、工程を生成。TDDを推奨し、計画変更時は必ず`ideas/`から修正する。 |\n| **designs/** | **構造定義 (Structure)** | **【任意】** AIにMermaidなどで構造図を作成させ、複雑な仕様における人間とAIの相互理解を深める。 |\n| **refs/** | **固有の参考資料** | **【任意】** そのフェーズでのみ必要な一時的なコード片やテストデータなどを格納し、タスク実行時に参照する。 |\n\n### 4.3 フェーズ内フォルダごとの詳細な手順\n\n#### 4.3.1 `ideas/` (アイデア・要件定義)\n\n**目的:** 開発したいものの**要件、ビジョン、機能**を定義します。AIとの壁打ちの「種」となる最上位のコンテキストです。\n\n**手順:**\n\n1.  **壁打ち:** ChatGPTやGeminiなどのAIと対話し、アイデアの具体化、実現可能性の検討、機能の洗い出しを行います。\n2.  **ファイル化:** 十分に議論した後、その結果を**Markdown形式で整理**し、要件定義とします。\n3.  **命名:** `{mmm}-{title}.md`の規則に従って`branches/{branch_id}/ideas/`内に保存します。\n\n#### 4.3.2 `plans/` (開発計画)\n\n**目的:** アイデアを実現するための**具体的なタスク、工程、マイルストーン**を定義し、実行の指針とします。\n\n**手順:**\n\n1.  **計画の生成:** `ideas/`内のファイルを参照させ、「このアイデアを実現するための計画を作成してください」とAIに依頼します。空の計画ファイルを作成し、その中に記述させるのが効率的です。\n2.  **実行前のコミット:** **コード生成を含む計画を実行する直前**に、現在のプロジェクトの状態をGitにコミットします。これにより、AIによる大規模な改変や意図しない変更が発生した場合でも、即座に安全な状態へロールバックできます。\n3.  **実現可能性の検討:** 生成された計画を人間が確認し、技術的、時間的に実現可能か評価します。\n4.  **計画の実行:** 承認された計画ファイルを参照させ、「この計画の最初のステップを実行してください」と依頼します。\n\n**計画のアップデート:**\n\n- 計画から漏れや変更が見つかった場合、**まず`ideas/`の要件を修正**してから、そのファイルを指定して計画の更新を依頼します。\n- チャットメッセージでの軽微な修正依頼は、コンテキストとして残りづらいため極力避けます。\n\n#### 4.3.3 `designs/` (設計ドキュメント)\n\n**目的:** **【任意】** コードの複雑化や規模拡大に伴い、AIと人間の相互理解を深めるため、システム構造や処理フローを図やドキュメントとして記録します。\n\n**活用方法:**\n\n- **AIへの依頼:** 開発中のコードベースや計画を参照させ、「現在のシステムの設計概要（処理フロー図、クラス図など）をMarkdownまたはMermaid形式で作成してください」と依頼し、`designs/`に保存します。\n- **コンテキストの参照:** 新しい計画を作成する際や、既存コードを修正する際に、AIにこの設計ファイルを参照させ、現状の構造を正しく把握させます。\n\n#### 4.3.4 `refs/` (フェーズ固有の参考資料)\n\n**目的:** **【任意】** そのフェーズのタスクにのみ必要な**一時的・固有の知識**（例: 特定のコードスニペット、一時的なテストデータ、外部仕様の一部）を保存します。\n\n**活用方法:**\n\n- プロジェクト全体で共有すべきでない、または一時的な参照にのみ使用するファイルを格納し、必要なタスク実行時にAIに参照させます。\n\n-----\n\n## 5 ファイル命名規則とパス管理\n\n### 5.1 プロンプトファイルの命名規則\n\nすべてのプロンプトファイルは、以下の規則に従い、**ブランチ**ごとに**時系列**を識別できるようにします。\n\n> **`branches/{branch_id}/{ideas|plans}/{mmm}-{title}.md`**\n\n- **`{branch_id}` (ブランチ識別子):** 現在作業中のGitブランチ名の簡略形（例: `feat-login`, `bug-001`）。衝突回避を目的とします。\n- **`{mmm}` (ファイル連番):** 3桁の連番（例: `001`）。各ブランチ内での作成順を示します。\n- **`{title}`:** 内容を簡潔に表すタイトル（例: `initial-api-reqs`）。\n\n### 5.2 ファイル参照の標準\n\n**パスの永続性**はVibe Coding標準の核心です。\n\n1.  **AIへの指示:** AIへの依頼時には、以下の手法に基づき、参照パスを指定すること。\n\n  - **IDE及びGUIベースの環境 (VSCode, Cursor等):** ファイルをメッセージフォームへ**ドラッグ＆ドロップ**するか、`@`による**逐次的検索**を通じて、相対パスを生成すること。\n  - **CLIベースの環境 (Claude Code等):** **現在アクティブなフェーズフォルダ内を起点とする相対パス**を、手動でメッセージ内に直接記述すること。\n  - **例:** `./branches/feat-login/ideas/001-initial-api-reqs.md`\n\n2.  **文脈の保持:** この方法により、チャット履歴が流れても、AIは参照されたファイルから常に正確なコンテキストを読み込み、一貫した出力を維持できます。\n\n### 5.3 Gitと連携した運用\n\n- **ファイルのコミット:** `ideas/`, `plans/`, `designs/`内のプロンプトファイルは、コードファイルと同様にGitでバージョン管理し、コミットメッセージで変更内容を明確に記録します。\n- **ブランチID:** ファイル名にブランチIDを含めることで、どのブランチで議論・計画されたプロンプトであるかを一目で識別できます。"
