        - activation:
            mode: trigger
          apiVersion: agent.meta/v1
          applies_when: Applies when writing Python code that includes logging statements
          body: |
            # ログ記述規範 (Logging Rules)

            本規範は、ログの記述基準を定め、運用時の障害調査と開発時のデバッグを効率化することを目的とする。

            ## 1. ログレベルの使用基準

            ### 1.1 INFO (運用者向け -- 平時確認)

            **定義**: システム管理者が、トラブルではない平時にでも確認しておきたいログ。正常に動作していることが分かるもの。

            **出力すべき場面**:
            - サーバー/コンポーネントの起動・終了
            - 設定ファイルのロード完了と主要設定値のサマリ
            - 外部接続の確立（DB、API、syslog）
            - リクエスト受付のサマリ（詳細はDEBUG以下）

            **出力してはいけないもの**:
            - ループ内の反復ごとのログ
            - 変数値のダンプ

            ### 1.2 WARN (運用者向け -- 警告)

            **定義**: エラーではないが、エラーにつながる可能性がある望ましくない状態。

            **出力すべき場面**:
            - マージン付き閾値の逆転・超過
            - スローダウンの検出
            - リトライの発生（試行回数を含む）
            - 継続可能な例外の発生
            - ファイル読み取り失敗（フォールバックあり）
            - レスポンスのフォーマット/バージョン不一致（互換性で読める場合）
            - syslog 接続失敗によるフォールバック発生

            ### 1.3 ERROR (運用者向け -- 障害)

            **定義**: 処理を続行できず諦めなければならない問題。

            **必須ルール**: ERROR ログには**その時点で収集可能な有益情報を全て含める**。後から TRACE レベルにして再現するのでは機会を逃すため、ERROR ログ自体に詳細なコンテキストを含めること。

            **含めるべき情報**:
            - エラーメッセージとスタックトレース（利用可能な場合）
            - リクエストの概要（URL、メソッド、モデル名）
            - レスポンスの概要（ステータスコード、ボディの先頭 500 バイト）
            - コンテキスト情報（セッションID、プロバイダー名、変換パス）
            - 発生時のタイムスタンプ

            **注意**: `sys.exit()` や未捕捉例外による強制終了は不要。あくまでその処理のエラーを通知する。

            ### 1.4 DEBUG (開発者向け -- フロー追跡)

            **定義**: 何を処理しているかが分かるもの。外形からの観測だけで内部処理フローが理解できるようにする。

            **出力すべき場面**:
            - 関数のエントリ（主要な関数のみ。ユーティリティ関数は不要）
            - 条件分岐の判定結果（例: "routing to openai provider", "using responses mode"）
            - オブジェクトの生成・破棄（セッション作成、プロセス起動/終了）
            - ルーティング決定の理由
            - 設定値の適用結果

            **パラメータ**: 処理を説明するための簡単なパラメータを含める。
            ```python
            logger.debug("routing request", extra={"model": model, "provider": provider, "mode": mode})
            ```

            ### 1.5 TRACE (開発者向け -- データダンプ)

            **定義**: DEBUG を補足する詳細データのダンプ。

            **出力すべき場面**:
            - JSON ボディの全文（リクエスト/レスポンス）
            - HTTP ヘッダーの一覧
            - SSE イベントの生データ
            - 設定ファイルの全内容
            - 変換前後のデータ比較
            - CLI プロセスの stdout/stderr の生出力

            **注意**: TRACE は大量のデータを出力するため、本番環境では通常無効にする。

            ## 2. コンポーネントタグ付けルール

            すべてのコンポーネントは共通ロガー経由でコンポーネント名を付与し、ログにコンポーネント名を含めること。
            （実装はプロジェクト共通ロガーの API に従う。例: `with_component("tern")`）

            | コンポーネント | タグ名 |
            |---|---|
            | Tern コアサーバー | `tern` |
            | LLM Gateway Proxy | `llmgateway` |
            | Agent Service | `agentservice` |
            | Coding Agent (Claude Code) | `claudecode` |
            | Coding Agent (Codex) | `codex` |
            | WebSocket Server | `wsserver` |
            | Bifrost Driver | `bifrost-driver` |
            | Config Loader | `config` |
            | Vault | `vault` |

            ## 3. フィールド命名規則

            ログのキー/バリューフィールドには以下の命名規則を適用する:

            - **スネークケース**を使用: `session_id`, `model_name`, `provider`
            - **共通フィールド名**:
              - `session_id`: セッション識別子
              - `model`: モデル名
              - `provider`: プロバイダー名 ("anthropic", "openai")
              - `method`: HTTP メソッド
              - `path`: リクエストパス
              - `status`: HTTP ステータスコード
              - `duration_ms`: 処理時間（ミリ秒）
              - `error`: エラーメッセージ
              - `body_size`: ボディサイズ（バイト）
              - `attempt`: リトライ試行回数

            ## 4. 実装における注意事項

            - **DEBUG ログは積極的に挿入する**。外形からの観測だけで内部処理が追跡できる透明性を目標とする。
            - **TRACE ログはデータダンプ専用**。DEBUG ログに変数の中身を書かず、TRACE に分離する。
            - **ERROR ログは詳細に**。後で再現するのでは遅い。その時点の情報を全て含める。
            - **INFO ログは控えめに**。ループ内やリクエストごとに大量のINFOを出さない。
          id: logging-rules
          kind: policy
          scope: project
          selected: true
          tags:
            - baseline
          title: Logging Rules
        - activation:
            mode: trigger
          apiVersion: agent.meta/v1
          applies_when: Applies when creating implementation plans or design documents
          body: "# 計画立案規範 (Planning Rules)\n\n本規範は、計画立案プロセス、品質管理、およびビルド/テストの実行基準を定め、プロジェクトの円滑な進行を確保することを目的とします。\n\n## 1. テストと品質に対する共通哲学 (General Philosophy)\n\nコンポーネントと言語に関わらず、以下の原則を遵守してください。\n\n### 1.1 TDD (Test Driven Development)\n*   **Failed First**: いかなる機能も、「その機能が正しく動作することを確認するテスト」を先に書き、それが失敗することを確認してから実装を開始してください。\n*   **Verification Oriented**: 「どう実装するか」の前に「どう検証するか（テストするか）」を計画してください。検証不可能な機能は実装してはいけません。\n\n### 1.2 Fail Fast\n*   フィードバックループを最小化するため、単体テスト（Unit Test）は高速に実行可能であることを維持してください。\n*   統合テスト等の重いテストを回す前に、単体テストで論理的な誤りを排除してください。\n\n### 1.3 Concretization (具体化)\n*   **Abstraction is Logic Loss**: 仕様書から実装計画への変換プロセスは、抽象化（要約）ではなく、**具体化（詳細化）**のプロセスでなければなりません。\n    *   **Data Structure is Mandatory**: 仕様書に記載された構造体定義やデータモデルは、必ず実装計画の `Proposed Changes` に含めてください。これらを「自明な既存コード」や「コンテキスト情報」として省略してはいけません。\n*   **Traceability**: 前段のドキュメント（仕様書）に記載された具体的な手順、条件、シナリオ（例: 「(1) Aして (2) Bする」）は、実装計画においても個別の検証項目または実装手順として明確に追跡可能である必要があります。\n\n## 2. 計画策定における要件 (Planning Requirements)\n\n実装計画 (`prompts/phases/.../plans/...`) を作成する際は、**「これを読めば実装の実現方法が明確にわかる」** レベルの詳細さが求められます。\n\n- どのファイルを新規に作成すべきか、もしくはどのファイルをどのように修正すべきかを明確に記述してください。\n- コーディングする際に必要な情報を、具体的に記載してください。\n\n### 2.1 Backend Development (Python)\n\nバックエンド機能の計画においては、以下の要素を具体的に記述してください。\n\n*   **詳細な実現手順**:\n    *   どのパッケージの、どのクラス/Protocol/関数に変更を加えるか。\n    *   追加するAPIエンドポイントの定義（パス、メソッド、リクエスト/レスポンス。Pydantic モデル名を含む）。\n*   **テスト計画 (Unit & Integration)**:\n    *   **Unit Tests**: `@pytest.mark.parametrize` によるケース設計。モックが必要な依存関係（DB, 外部API）。\n    *   **Integration Tests**: `tests/` 配下のどのファイルに追加するか。実際のDBやDockerコンテナとの連携確認手順。\n    *   **統合テスト必要性の判断基準**: 以下のいずれかに該当する場合、統合テストは**必須**です。\n        *   ファイルシステムへの書き込み/読み取りを行う\n        *   SQLite/DB 操作を行う\n        *   外部コマンド (git 等) を呼び出す\n        *   CLI サブコマンドとして利用者に提供される\n        *   上記のいずれにも該当しない純粋なロジックのみの場合は、単体テストのみで可。ただし Verification Plan にその理由を明記すること。\n    *   記述順序: `Proposed Changes` では必ず `test_*.py` を先に記述してください。\n\n### 2.2 Frontend Development (VSCode/React)\n\nVSCode拡張機能およびWebviewの計画においては、GUI特有の検証容易性を確保するため、以下の要素が必須です。\n\n*   **Component Design (Webview)**:\n    *   ReactコンポーネントのProps定義とState管理。\n    *   **Test IDの定義**: テストから操作するインタラクティブな要素（ボタン、入力欄）には、必ず `data-testid` を定義するよう計画に含めてください。\n        *   例: 「Runボタン (`data-testid=\"run-button\"`) を追加する」\n*   **E2E Scenarios (VSCode Integration)**:\n    *   **主たる検証手段**: GUIの可視的な変更やインタラクションの追加は、必ず E2E テストシナリオとして定義します。手動確認はあくまで補助的な位置付けです。\n    *   **Test Driver Pattern**: UI操作を直接テストコードに書くのではなく、検証用ドライバー (`TestDriver`) を通じて操作する前提でシナリオを記述してください。\n    *   **Scenarios**: `ide/extension/e2e/scenarios/` に追加する具体的なテストシナリオファイル名と、そのシナリオで検証するユーザーフロー。\n        *   Bad: 「タスク作成をテストする」\n        *   Good: 「`task_creation.test.ts` を作成。コマンドパレットから 'Create Task' を実行し、Webviewが開くことを確認。`data-testid=\"submit\"` を押下し、サイドバーに項目が増えることを検証する。」\n\n\n\n\n## 3. ビルドとテスト方針\n\n本プロジェクトは `.agent/workflows/` および `scripts/` を活用した標準化されたプロセスを採用しています。\n\n### 3.1 標準化された実行手段\n\n全ての検証は `scripts/` 配下のスクリプトを通じて行ってください。\n\n*   **Backend Track**:\n    *   Unit: `scripts/process/build.sh --skip-frontend --skip-etc`\n    *   Integration: `scripts/process/integration_test.sh`\n*   **Frontend Track**:\n    *   Unit (Webview): `./scripts/process/build.sh` (Prohibit direct `npm test` in plans)\n    *   E2E (VSCode): `scripts/process/integration_test.sh --categories gui`\n\n    **Note**: Do not use `cd` commands in plans. Use paths relative to the project root.\n\n    > [!WARNING]\n    > **Prohibition of Raw Toolchain Commands**:\n    > You are **PROHIBITED** from suggesting raw `python -m pytest`, `uv run pytest`, or `npm run build` commands in implementation plans.\n    > You **MUST** use the provided scripts (`scripts/process/build.sh`, `scripts/process/integration_test.sh`).\n    > *Reason*: These scripts handle critical build steps (venv activation, environment variables, incremental build logic) that raw commands miss.\n\n### 3.2 テストファイルの配置と命名\n\n*   **Backend**: `test_*.py` / `*_test.py` (Unit), `tests/{cat}_{func}_test.py` (Integration)\n*   **Frontend**: `Component.test.tsx` (Unit), `ide/extension/e2e/scenarios/{scenario}.test.ts` (E2E)\n\n\n### 3.3 ビルドと検証要件 (Build & Verification Requirement)\n\n実装計画の「Verification Plan」には、検証に行うための**スクリプト実行コマンド**を必ず明記してください。\nGUIの変更であっても、手動検証ではなく自動化された E2E テストを使用することを原則とします。\n\n*   **推奨記述例**:\n    1.  **Automated Verification**: Run `./scripts/process/build.sh && ./scripts/process/integration_test.sh --categories gui --specify \"New Feature\"` to verify the UI changes.\n\n    > [!WARNING]\n    > **Prohibition of Manual Verification**:\n    > You are **PROHIBITED** from planning \"Manual Verification\" as the primary verification method.\n    > Do not write steps like \"Open VSCode and click button\". Instead, write \"Create E2E test scenario to click button\".\n    > *Exception*: Strictly visual aesthetics (e.g. \"Check if the color is correct\") can be manual, but functional logic MUST be automated.\n    \n    *   **Prohibited Commands**:\n        *   ❌ `npm run build`, `npm test`\n        *   ❌ `python -m pytest`, `uv run pytest`\n        *   ❌ `cd ... && ...`\n        *   ❌ `integration_test.sh` (STRICTLY PROHIBITED without preceding `build.sh`)\n    *   **Required Commands**:\n        *   ✅ `./scripts/process/build.sh && ./scripts/process/integration_test.sh`\n\n    > [!WARNING]\n    > **Partial Build Flags in Final Verification**:\n    > `--backend-only`, `--skip-frontend`, `--skip-etc` は開発中の高速フィードバック用です。\n    > Verification Plan の最終検証コマンドには `./scripts/process/build.sh` (フラグなし) を使用してください。\n"
          id: planning-rules
          kind: policy
          scope: project
          selected: true
          tags:
            - baseline
          title: Planning Rules
        - activation:
            mode: trigger
          apiVersion: agent.meta/v1
          applies_when: Applies when starting work, understanding project workflows, or running scripts
          body: |4
            # プロジェクト共通指示書 (`.agent/instructions.md`)

            ## 技術スタック (想定)
            - 言語: Python (v3.12+)
            - パッケージ管理: `uv` + `pyproject.toml`
            - アーキテクチャ: Modular/Layered Architecture

            ## ディレクトリ構造と情報源
            - **仕様・設計**: `prompts/phases/` 配下が「正」の情報源です。
                - `000-xxx`: フェーズ名称
                    - `branches/`: ブランチ別のアイデアと計画
                        - `main/`: `main`ブランチ (現在の作業ブランチ名を入れること)
                            - `ideas/`: 主要なアイデアメモと仕様書
                                - `000-yyy.md`: アイディアと要件を記したマークダウンファイル
                                - `001-zzz.md`: 同上
                            - `plans/`: 実装計画書

            ## 開発プロセス

            - **仕様ファースト**
                - 実装の前に `prompts/phases/...` 以下の `branches/` > 作業ブランチ名 > `ideas/` フォルダに仕様を作成・更新してください。仕様書のファイル名は、`000-` から始まる3桁の連番の数字で管理してください。

            ## ワークフロー間の流れ

            `.agent/workflows/` 配下に定義されたワークフローは、以下の順序で連携して動作します:

            ### 1. 仕様書作成フェーズ
            **ワークフロー**: [`create-specification.md`](.agent/workflows/create-specification.md)

            1. **人間**: 実装のアイディアを考える
            2. **AI**: `create-specification.md` を使って仕様のマークダウンファイルを生成
               - 出力先: `prompts/phases/000-xxx/branches/[ブランチ名]/ideas/XXX-Name.md`
               - 内容: 背景、要件、実装計画の概要
            3. **人間**: 仕様書をレビュー
               - 修正が必要な場合は、AIに指示して修正させる
               - 問題なければ、**明示的に次のフェーズへ進むよう指示する**（勝手に進まないこと）

            ### 2. 実装計画作成フェーズ
            **ワークフロー**: [`create-implementation-plan.md`](.agent/workflows/create-implementation-plan.md)

            1. **人間**: 仕様マークダウンファイルを指定
            2. **AI**: `create-implementation-plan.md` を使って詳細な実装計画を作成
               - 入力: `prompts/phases/000-xxx/branches/[ブランチ名]/ideas/XXX-Name.md`
               - 出力: `prompts/phases/000-xxx/branches/[ブランチ名]/plans/YYY-Name.md`
               - 内容: 統合テスト計画、単体テスト計画、実装手順、検証計画
               - 大きな仕様の場合: 複数の実装計画ファイルに分割（Part1, Part2, ...）
            3. **人間**: 実装計画をレビュー
               - 修正が必要な場合は、AIに指示して修正させる
               - 問題なければ、**明示的に次のフェーズへ進むよう指示する**（勝手に進まないこと）

            ### 3. 実装実行フェーズ
            **ワークフロー**: [`execute-implementation-plan.md`](.agent/workflows/execute-implementation-plan.md)

            1. **人間**: 実装計画ファイルを指定
            2. **AI**: `execute-implementation-plan.md` に従って実装を実行
               - 入力: `prompts/phases/000-xxx/branches/[ブランチ名]/plans/YYY-Name.md`
               - プロセス:
                 - コーディングルール (`{{policy:coding-rules}}`) を遵守してコード実装
                 - テストルール (`{{policy:testing-rules}}`) を遵守してテスト作成
                 - 実装計画のチェックボックス `[ ]` → `[x]` で進捗管理
                 - 進行中項目は `[/]` でマーク

            ### 4. ビルド・検証フェーズ
            **ワークフロー**: [`build-pipeline.md`](.agent/workflows/build-pipeline.md)

            実装実行フェーズ内で自動的に使用されます:

            1. **AI**: `scripts/process/build.sh` を実行
               - 全体ビルドと単体テストを実行
               - **Linux**（ワークスペースの OS が Linux）および **Cursor / VS Code の Remote-SSH で接続先が Linux** の場合は、**必ず `--skip-etc` を付けて** `./scripts/process/build.sh --skip-etc` とすること（`etc` 配下の `mcp-command-runner` / `image-inspector` 等が当該環境で失敗しやすいため）
               - 失敗時は即座に修正して再実行
            2. **AI**: `scripts/process/integration_test.sh` を実行
               - 統合テストを実行
               - **Linux** および **Remote-SSH の接続先が Linux** のときは **headless 前提**とする: **`--headed` と `--ui` を付けない**（Playwright の headless 既定のまま）。`integration_test.sh` は **`xvfb-run -a` で必ずラップ**して実行する（`./scripts/process/integration_test.sh` を直接叩かない。`--resume` や `--specify` を付けるときも同様）。根拠は `features/frontend/scripts/integration_test.sh` 冒頭コメント。**`xvfb-run` が無いホストでは先に Xvfb 系パッケージを入れてから実行**する。
               - 失敗時は修正して該当テストのみ再実行 (`--specify` オプション使用)
            3. **AI**: 必要に応じて全テストを再実行してリグレッション確認

            ### 調査ワークフロー（開発フローとは独立）
            **ワークフロー**: [`investigate.md`](.agent/workflows/investigate.md)

            開発フロー（仕様 → 計画 → 実装）とは独立した、**読み取り専用**の調査ワークフローです。

            1. **人間**: 調査内容を依頼（バグ調査、設計理解、依存関係の把握など）
            2. **AI**: `investigate.md` に従って調査を実施
               - コードの閲覧・検索、ログ分析、Gitの履歴追跡など
               - 必要に応じて既存コマンドの実行による現状把握
               - **コードの変更は一切行わない**
            3. **AI**: 調査結果をArtifactレポートとしてまとめて報告
            4. **人間**: レポートを確認し、必要に応じて追加調査を依頼
               - 修正が必要な場合は、別途 `/create-specification` から開発フローを開始

            ### ワークフロー図

            ```
            === 開発フロー ===

            [人間: アイディア]
                   ↓
            [AI: create-specification.md] → 仕様書生成
                   ↓
            [人間: レビュー・修正・進行指示]
                   ↓
            [AI: create-implementation-plan.md] → 実装計画生成
                   ↓
            [人間: レビュー・修正・進行指示]
                   ↓
            [AI: execute-implementation-plan.md]
                   ├→ コーディング
                   ├→ テスト作成
                   └→ [AI: build-pipeline.md]
                          ├→ scripts/process/build.sh (全体ビルド・単体テスト)
                          └→ scripts/process/integration_test.sh (統合テスト)

            === 調査フロー（独立・読み取り専用）===

            [人間: 調査依頼]
                   ↓
            [AI: investigate.md] → コード解析・ログ分析・コマンド実行
                   ↓
            [AI: レポート作成] → Artifact として報告
                   ↓
            [人間: レポート確認・追加調査依頼]
                   └→ 修正が必要な場合は開発フローへ
            ```

            ### 重要なポイント

            - **人間のレビューポイント**: 仕様書と実装計画の2箇所
            - **自動実行部分**: 実装実行とビルド・検証パイプライン
            - **進捗管理**: 実装計画のチェックボックスで進捗を可視化
            - **テスト順序**: 単体テスト → 統合テスト → その他のテスト
            - **スクリプト配置**: `scripts/` ディレクトリに各種ビルド・テストスクリプトを配置
            - **フェーズ移行の禁止事項**: 現在のワークフローが完了しても、人間からの明示的な指示があるまでは、勝手に次のワークフロー（フェーズ）を開始してはいけません。
            - **システム自動承認（Proceed to execution）メッセージに関する注意事項**:
              - 実装計画書などの成果物を書き出した際、Antigravity環境の仕組み（Stop Hook）により、システム側から `stop hook blocked... The user has automatically approved... Proceed to execution` と自動承認のシグナルが注入されることがあります。
              - これはAntigravityシステム内部のアーティファクト管理上の自動承認であり、**人間が管理する `ideas/` や `plans/` 下の成果物そのものを人間が承認したという意味ではありません。**
              - したがって、この自動承認システムメッセージを受信した場合であっても、**チャット上で人間から直接「計画を承認する」「実装へ進んでください」といった明示的な意思表示があるまでは、絶対に次のフェーズ（実装の実行やコードの変更、ビルド）を開始してはいけません。**

            ## シェル環境の指定

            コマンドラインでスクリプトやコマンドを実行する際は、**bash** の使用を推奨します。
            **Powershellは使わないで**ください。

            ### Windows環境での注意事項

            > [!IMPORTANT]
            > Windows環境では、PowerShellではなく必ず **Git Bash** のbash互換環境を使用してください。

            - **推奨環境**: Git Bash, WSL (Windows Subsystem for Linux), Cygwin など
            - **理由**: プロジェクトのスクリプト (`scripts/` 配下) はbashスクリプトとして記述されているため、PowerShellでは正しく動作しない可能性があります
            - **確認方法**: ターミナルで `bash --version` を実行して、bashが利用可能か確認してください

            ### Mac / Linux環境

            - 標準のbashシェルを使用してください
            - **Linux**（ローカル Linux および **Remote-SSH のリモートが Linux**）: `scripts/process/build.sh` を叩くときは **`--skip-etc`** を付与すること（例: `./scripts/process/build.sh --skip-etc`）
            - **Linux / Remote-SSH（Linux）**: `scripts/process/integration_test.sh` は **`--headed` / `--ui` を付けず**、かつ **`xvfb-run -a` で必ずラップ**して実行する（スクリプトを直接実行しない）
            - **macOS**: 上記 `--skip-etc` は Linux / Remote-SSH（Linux）専用の補足であり、macOS では従来どおりプロジェクトの期待に合わせて実行すればよい

            ## Git 操作ルール

            実装フェーズ（`execute-implementation-plan` や `build-pipeline`、`run-all-tests`）では、以下のルールに従って Git 操作を行ってください。

            > [!IMPORTANT]
            > **コミットメッセージのクォーティング**: Windows 環境では、PowerShell 経由で bash を呼び出す際にコミットメッセージが途切れる問題があります。
            > **必ず `-m` の引数にはシングルクォートを使用**してください（例: `git commit -m 'feat: add feature'`）。
            > Mac / Linux 環境ではこの問題は発生しませんが、統一のためシングルクォートの使用を推奨します。

            ### コミットの方針

            - **こまめにコミット**: コードの変更は、目的や意味のある単位で `git add` → `git commit` を実施してください。大きな変更を一度にまとめてコミットすることは避けてください。
            - **コミット単位の目安**:
                - 1つの関数/メソッドの実装完了
                - 1つのテストファイルの作成・修正完了
                - 1つのバグ修正完了
                - リファクタリングの1ステップ完了
                - 設定ファイルの変更
            - **コミットメッセージ**: 変更内容が分かる簡潔なメッセージを英語で記述してください。
                - 例: `feat: add bearer auth middleware`, `test: add unit tests for token validation`, `fix: handle None in auth handler`
            - **コミットのタイミング**: 実装計画の各ステップを完了するごとに、対応する変更をコミットしてください。

            ### プッシュの方針

            - **ビルド・テスト完了後にプッシュ**: `build.sh` および必要な統合テストが全て成功した時点で `git push` を実施してください。
            - テストが失敗している状態ではプッシュしないでください。
            - 修正ループ（Fix Loop）中のコミットは、テストが全て通過してからまとめてプッシュします。

            ### 実行例

            ```bash
            # 実装の各ステップ完了時
            git add <変更ファイル>
            git commit -m 'feat: implement rate limiter class'

            # ビルド・テスト全成功後
            git push
            ```

            ## ファイル管理規則
            - **中間生成ファイル**: タスク進行中に生成される中間ファイル（ビルドエラーログ、デバッグ出力、一時的なドキュメントなど）は、必ず `tmp/` ディレクトリ以下に作成してください。
                - 例: `build_error.txt`, `doc_delta.txt`, `doc_resp.txt` などは `tmp/build_error.txt`, `tmp/doc_delta.txt`, `tmp/doc_resp.txt` として作成
                - ログファイル、PIDファイルなども同様に `tmp/` 以下に配置すること（例: `tmp/vscode_launch.log`, `tmp/.vscode_cdp.pid`）。
                - これらのファイルはプロセスでは必要ですが、タスク完了後はゴミとなり、誤ってコミットされるリスクがあります。
                - `tmp/` ディレクトリは `.gitignore` で除外されているため、コミットされません。
            - **ファイルパスの表示**: できるだけ「file://プロジェクトルートからの相対パス」を表示するようにしてください。
